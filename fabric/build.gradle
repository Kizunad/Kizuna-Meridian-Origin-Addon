plugins { id 'net.fabricmc.fabric-loom' }

description = '出身的 26.2 Fabric 接线：类型登记入口、数据包读取、身体存取、网络、指令、进度触发器与选择界面。'

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.wispforest.io/releases' }
    // owo 0.13 依赖的 kdl4j 只发布在 JitPack，只从那里取这一组。
    maven {
        url = 'https://jitpack.io'
        content { includeGroup 'com.github.kdl-org' }
    }
}

dependencies {
    // 26.x 不混淆：直接用官方名编译，没有映射，模组依赖也不经重映射。
    minecraft libs.minecraft
    implementation libs.fabric.loader
    implementation libs.fabric.api

    // 纯规则和协议随正式 JAR 嵌套；Framework 的身体协议经 server 库传递进来。
    implementation project(':server')
    include project(':server')
    include project(':shared')
    // 网络通道和 /meridian 指令注册点来自必装的 Framework；开发运行由完整装配按同一组件装入。
    compileOnly('dev.kizuna.meridian:fabric') { transitive = false }
    // 配置写在 TOML，安装 JAR 自带解析库；版本目录条目是 Provider，嵌套声明单独写。
    implementation libs.tomlj
    include libs.tomlj
    implementation libs.antlr.runtime
    include libs.antlr.runtime
    // 选择界面直接用 owo-lib 写；运行时由完整装配提供。
    compileOnly libs.owo
    // owo 给原版类注入了接口，Loom 编译用的原版 JAR 带着这些接口；单测一加载原版类就要找到它们。
    testRuntimeOnly libs.owo
    testImplementation libs.junit4
}

test { useJUnit() }

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

// 开发运行沿用 Meridian 统一完整装配；Framework 的 server 库和 Protobuf 在安装 JAR 中是嵌套库，开发时显式补齐。
apply from: new File(kizunaWorkspace.directory('framework'), 'scripts/full-assembly.gradle')
dependencies {
    localRuntime('local.meridian:server') { transitive = false }
    localRuntime libs.protobuf.java
    localRuntime files(kizunaWorkspace.artifact('human', 'client', false))
}

def gametestRunDirectory = providers.gradleProperty('gametestRunDir').getOrElse('build/gametest')

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
    clientTest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

dependencies {
    // 登录假玩家与记录连接的夹具来自功法库的 testFixtures。按已构建的文件取，不把功法库组合进来：
    // 功法库要登记自己的天赋类型，会反过来组合本仓，两边互相组合就成环了。
    gametestImplementation files(kizunaWorkspace.artifact('technique', 'fabric', false).path
            .replace('.jar', '-test-fixtures.jar'))
}

loom {
    mods {
        meridian_origin { sourceSet sourceSets.main }
        meridian_origin_test { sourceSet sourceSets.gametest }
        meridian_origin_client_test { sourceSet sourceSets.clientTest }
    }
    runs {
        gametest {
            server()
            name '出身 GameTest'
            source sourceSets.gametest
            runDir gametestRunDirectory
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=build/gametest-results.xml'
        }
    }
}

// 客户端截图验收的窗口大小和输出目录名可以改，窄窗口另跑一次：-PoriginClientSize=480x720 -PoriginClientShots=narrow。
def clientSize = providers.gradleProperty('originClientSize').getOrElse('1280x720').split('x')
def clientShots = providers.gradleProperty('originClientShots').getOrElse('wide')
loom {
    runs {
        clientTest {
            client()
            name '出身界面客户端测试'
            source sourceSets.clientTest
            runDir 'build/clienttest'
            vmArg "-Dmeridian.origin.shots=${clientShots}"
            programArgs '--quickPlaySingleplayer', 'origin-screen-test', '--width', clientSize[0], '--height', clientSize[1]
        }
    }
}

afterEvaluate {
    tasks.named('runGametest') {
        doFirst {
            // 每局从空目录新建世界；固定本机地址与最小视距，避免占用用户环境。
            // 完整装配里的 owo 在开发环境缺 eula.txt 时会读控制台确认，Gradle 进程没有输入会直接卡住，所以预先写好。
            def runDirectory = file(gametestRunDirectory)
            runDirectory.mkdirs()
            new File(runDirectory, 'world').deleteDir()
            new File(runDirectory, 'eula.txt').text = 'eula=true\n'
            new File(runDirectory, 'server.properties').text = '''online-mode=false
server-ip=127.0.0.1
server-port=0
generate-structures=false
view-distance=2
simulation-distance=2
'''
        }
    }
}

// 客户端验收只取 GameTest 世界的全局存档：level.dat（数据包等）与 data/minecraft（平坦生成设置、游戏规则、天气与时钟），
// 不带区块、实体与模组存档；每次都重新同步，上一局选过的出身不留到下一局。先跑过一次 GameTest 才有这份世界。
tasks.register('prepareClientTestWorld', Sync) {
    from(layout.projectDirectory.dir("${gametestRunDirectory}/world")) {
        include 'level.dat', 'data/minecraft/**'
    }
    into layout.buildDirectory.dir('clienttest/saves/origin-screen-test')
    outputs.upToDateWhen { false }
}
afterEvaluate {
    tasks.named('runClientTest') {
        dependsOn tasks.named('prepareClientTestWorld')
        def report = layout.buildDirectory.file('clienttest-results.txt')
        def options = layout.buildDirectory.file('clienttest/options.txt')
        doFirst {
            report.get().asFile.text = 'success=false\n'
            // 以简体中文启动；4903 是 26.2 的数据版本，免得选项走升级。
            // 26.2 首次启动先弹无障碍引导，挡住 quickPlay 进不了世界，所以每次都标记为已引导。
            options.get().asFile.parentFile.mkdirs()
            options.get().asFile.text = 'version:4903\nlang:zh_cn\nonboardAccessibility:false\n'
        }
        doLast {
            if (!report.get().asFile.text.startsWith('success=true')) {
                throw new GradleException("出身界面客户端验收失败：${report.get().asFile}")
            }
        }
    }
}
